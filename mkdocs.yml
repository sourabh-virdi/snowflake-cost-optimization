site_name: "Snowflake Cost Optimization Platform"
site_description: "Intelligent Data Governance & Cost Optimization for Snowflake"
site_author: "Snowflake Cost Optimization Team"
site_url: "https://sourabh-virdi.github.io/snowflake-cost-optimization"

repo_name: "snowflake-cost-optimization"
repo_url: "https://github.com/sourabh-virdi/snowflake-cost-optimization"
edit_uri: "blob/main/docs/"

nav:
  - Home: "index.md"
  - Getting Started:
    - Installation: "getting-started/installation.md"
    - Configuration: "getting-started/configuration.md"
    - First Steps: "getting-started/first-steps.md"
  - Architecture:
    - Overview: "ARCHITECTURE.md"
    - Design Patterns: "architecture/design-patterns.md"
    - Data Flow: "architecture/data-flow.md"
  - User Guide:
    - Dashboard: "user-guide/dashboard.md"
    - Cost Analysis: "user-guide/cost-analysis.md"
    - Usage Analysis: "user-guide/usage-analysis.md"
    - Optimization Recommendations: "user-guide/optimization.md"
    - Data Governance: "user-guide/governance.md"
  - API Reference:
    - Connectors: "api/connectors.md"
    - Analyzers: "api/analyzers.md"
    - Optimizers: "api/optimizers.md"
    - Configuration: "api/configuration.md"
  - Development:
    - Contributing: "development/contributing.md"
    - Testing: "development/testing.md"
    - Code Style: "development/code-style.md"
  - Deployment:
    - Local Setup: "deployment/local.md"
    - Production: "deployment/production.md"
    - Monitoring: "deployment/monitoring.md"
  - Caching System: "CACHING.md"
  - Blog:
    - Technical Deep Dive: "blog/technical-deep-dive.md"

theme:
  name: "material"
  features:
    - "navigation.tabs"
    - "navigation.sections"
    - "navigation.expand"
    - "navigation.path"
    - "navigation.top"
    - "search.highlight"
    - "search.share"
    - "header.autohide"
    - "content.code.copy"
    - "content.code.annotate"
  palette:
    - scheme: "default"
      primary: "blue"
      accent: "light blue"
      toggle:
        icon: "material/brightness-7"
        name: "Switch to dark mode"
    - scheme: "slate"
      primary: "blue"
      accent: "light blue"
      toggle:
        icon: "material/brightness-4"
        name: "Switch to light mode"
  font:
    text: "Roboto"
    code: "Roboto Mono"
  icon:
    repo: "fontawesome/brands/github"

plugins:
  - "search"
  - "mkdocstrings"

markdown_extensions:
  - "abbr"
  - "admonition"
  - "attr_list"
  - "def_list"
  - "footnotes"
  - "md_in_html"
  - "toc"
  - "pymdownx.arithmatex"
  - "pymdownx.betterem"
  - "pymdownx.caret"
  - "pymdownx.details"
  - "pymdownx.emoji"
  - "pymdownx.highlight"
  - "pymdownx.inlinehilite"
  - "pymdownx.keys"
  - "pymdownx.magiclink"
  - "pymdownx.mark"
  - "pymdownx.smartsymbols"
  - "pymdownx.superfences"
  - "pymdownx.tabbed"
  - "pymdownx.tasklist"
  - "pymdownx.tilde"

watch:
  - "src/" 